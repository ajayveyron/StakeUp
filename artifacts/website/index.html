                "@type": "Question",

                "@type": "Question",
                "name": "Is this gambling?",
                "acceptedAnswer": {
                  "@type": "Answer",

              },

                "@type": "Question",
                "name": "What if my proof gets rejected?",

                }
              },

                "@type": "Question",
                "name": "Where does missed-day money go?",
                "acceptedAnswer": {
                  "@type": "Answer",

                }
              },
